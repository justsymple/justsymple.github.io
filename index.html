<html lang="en">
    <!-- hey, it's symple! excuse my messy html and css, i barely know what i'm doing :sob:
        the page transitions unfortunately don't work that well in firefox but i'll fix it eventually
    -->
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta name="description" content="Symple's profiles and interests, all in one page!">
        <link rel="icon" type="image/x-icon" href="/assets/pfp.jpg">
        
        <title>Symple's Website</title>

        <link rel="stylesheet" href="/css/style.css">
        <link rel="stylesheet" href="/css/index.css">
    </head>
    <body class="fadeInTransition">
        <div class="container">
            <div class="mainmenu">
                <button class="mainmenubutton" id="banner">
                    <div class="mainmenuicon" id="bannericon"></div>
                    <div class="mainmenulabel">Symple</div>
                </button>
                <button class="mainmenubutton" id="info" onclick="aboutTransition()">ABOUT ME</button>
                <button class="mainmenubutton" id="profiles" onclick="profileTransition()">
                    <div id="profileslabel">Profiles and More</div>
                    <div id="profilesicon" src="/assets/ProfilesIcon.png">
                </button>
                <button class="mainmenubutton" id="song">
                    <div class="mainmenuicon" id="songicon"></div>
                    <div class="mainmenulabel" id="songlabel">
                        <p id="songtitle">Favorite Song</p>
                        <p id="songartist">Song Artist</p>
                        <div id="songstart">0:00</div>
                        <div id="songprogress"><div id="songfill"></div></div>
                        <div id="songend">0:00</div>
                        <div id="songplaypause" onclick="toggleMusic()"></div>
                    </div>
                </button>
            </div>
        </div>
    </body>

    <audio loop id="favsong" src="/assets/favsong.mp3"></audio>
    <script>
        const song = document.getElementById("favsong");
        const playButton = document.getElementById("songplaypause");
        const progressFill = document.getElementById("songfill");
        const songStart = document.getElementById("songstart");

        function toggleMusic() {
            if (song.paused) {
                song.play();
                playButton.style.backgroundImage = "url('/assets/pausebutton.png')";
            } else {
                song.pause();
                playButton.style.backgroundImage = "url('/assets/playbutton.png')";
            }
        }

        song.addEventListener("timeupdate", () => {
            const percentage = (song.currentTime / song.duration) * 100;
            const minutes = Math.floor(song.currentTime / 60);
            const seconds = Math.floor(song.currentTime % 60);
            const formattedSeconds = String(seconds).padStart(2, "0");

            progressFill.style.width = percentage + "%";

            songStart.textContent = minutes + ":" + formattedSeconds
        });

        function aboutTransition() {
            const aboutButton = document.getElementById("info");
            aboutButton.classList.add("flyOutTransition");
            document.body.classList.add("fadeOutTransition");

            setTimeout(() => {
                window.location.href = "/about.html";
            }, 700)
        }
        function profileTransition() {
            const profileButton = document.getElementById("profiles");
            profileButton.classList.add("flyOutTransition");
            document.body.classList.add("fadeOutTransition");

            setTimeout(() => {
                window.location.href = "/profiles.html";
            }, 700)
        }
    </script>

</html>
